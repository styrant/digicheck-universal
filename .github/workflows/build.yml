name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP calibration test
        run: build\Release\dsp_test.exe

      - name: Loudness (BS.1770) test
        run: build\Release\loudness_test.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectroscope-windows-x64
          path: build/Spectroscope_artefacts/Release/Spectroscope.exe

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: "Built from ${{ github.sha }}. Download Spectroscope.exe below."
          files: build/Spectroscope_artefacts/Release/Spectroscope.exe
