name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read        # the layout check downloads the previous build's layout

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # Same Vulkan SDK as NeuralNote's Windows build (its digest from NeuralNote's workflow)
      VULKAN_SDK_VERSION: 1.4.363.0
      VULKAN_SDK_SHA256: 94A82D378F7A5E3E54C9DB7D2FB7016AF136E14AC0A18DBF0F2F67A36352D141
      # Code signing turns on automatically once the Azure Artifact Signing secrets exist (see README).
      SIGN: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      # One version for everything: major.minor from the VERSION file, the patch from the build number
      # (CMake reads the same file and GITHUB_RUN_NUMBER)
      - name: Version
        shell: pwsh
        run: |
          $v = "$((Get-Content VERSION -TotalCount 1).Trim()).$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Version $v"

      # The transcription engine (muscriptor.cpp / ggml) is built with clang-cl like NeuralNote's own Windows
      # build, and with the Vulkan SDK for GPU support. The SDK is cached between runs.
      - name: Restore Vulkan SDK
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$root\Bin\glslc.exe")) {
            $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
            Invoke-WebRequest -UserAgent "UltimateAudioViewer-CI" -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $exe
            if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:VULKAN_SDK_SHA256) { Write-Error "Vulkan SDK checksum mismatch"; exit 1 }
            & $exe --root $root --accept-licenses --default-answer --confirm-command install
            if (-not (Test-Path "$root\Bin\glslc.exe")) { Write-Error "glslc missing after the Vulkan SDK install"; exit 1 }
          }
          "VULKAN_SDK=$root" | Out-File -Append $env:GITHUB_ENV
          "$root\Bin" | Out-File -Append $env:GITHUB_PATH

      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-clang-cl
          max-size: 2G

      - name: Configure
        shell: pwsh
        run: |
          # Visual Studio's own clang-cl matches its standard library (VS 2026's STL needs Clang 22+, newer than
          # the runner's separate LLVM); fall back to that LLVM only if VS has no Clang component
          $llvm = Join-Path $env:VCINSTALLDIR "Tools\Llvm\x64\bin"
          if (-not (Test-Path "$llvm\clang-cl.exe")) { $llvm = "C:\Program Files\LLVM\bin" }
          $cc = ("$llvm\clang-cl.exe" -replace '\\', '/')
          & "$llvm\clang-cl.exe" --version
          # CC / CXX in the environment also reach ggml's nested vulkan-shaders-gen build.
          # MUSCRIPTOR_CPU_VARIANTS: ggml-cpu built for x86-64-v2, v2+AVX/F16C and v3 (AVX2/FMA), picked at run
          # time (needs llvm-objcopy / nm / objdump / ar, which VS's or the runner's LLVM has); without it the
          # engine was fixed at AVX + F16C and faulted on CPUs without AVX
          "CC=$cc" | Out-File -Append $env:GITHUB_ENV
          "CXX=$cc" | Out-File -Append $env:GITHUB_ENV
          $env:CC = $cc; $env:CXX = $cc
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$cc" "-DCMAKE_CXX_COMPILER=$cc" `
            "-DCMAKE_LINKER=$llvm/lld-link.exe" "-DCMAKE_AR=$llvm/llvm-lib.exe" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DMUSCRIPTOR_VULKAN=ON `
            -DMUSCRIPTOR_CPU_VARIANTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build --parallel

      - name: DSP calibration test
        run: build\dsp_test.exe

      - name: Loudness (BS.1770) test
        run: build\loudness_test.exe

      - name: Spectrum analyzer DSP test
        run: build\analyzer_dsp_test.exe

      - name: Key finder test (vs PyTorch / librosa)
        run: build\key_test.exe Resources\keynet.bin tests\data

      - name: DAW bridge test (shared memory between the plugin and the app)
        run: build\bridge_test_artefacts\Release\bridge_test.exe

      - name: Key finder test, the build for CPUs without AVX2
        env:
          KEYNET_NO_AVX2: "1"
        run: build\key_test.exe Resources\keynet.bin tests\data

      - name: Tonal balance measurement test
        run: build\balance_test.exe

      - name: Chords, melody, key and resampling test
        run: build\harmony_test.exe

      - name: Transcription engine test (tiny random model, CPU and GPU builds)
        shell: pwsh
        run: |
          python -m pip install --quiet gguf numpy
          python tools\make_tiny_model.py tiny.gguf
          build\transcribe_test.exe tiny.gguf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Key page playback test (original, synth, mix, seeking; no sound card)
        run: build\player_test_artefacts\Release\player_test.exe

      - name: FFT analyzer test (calibration, channels, sidechain input, averaging, hold, slope, scalloping)
        run: build\fft_test.exe

      - name: Monitor test (levels, correlation per band, balance, width, sound field, PSR / PLR history)
        run: build\monitor_test.exe

      - name: Scope test (sweep, scroll, spectral bands, band-pass, stats, recorder)
        run: build\scope_test.exe

      - name: "Band listening test (VST3: bypass bit-exact, flat sum, bands, M/S/L/R, no clicks)"
        run: build\isolator_test.exe

      - name: VST3 loaded in a test host (sidechain bus, bit-exact pass-through, state)
        shell: pwsh
        env:
          PHT_NO_EDITOR: "1"
        run: |
          build\plugin_host_test_artefacts\Release\plugin_host_test.exe "build\DigiCheckUniversal_artefacts\Release\VST3\Ultimate Audio Viewer.vst3" ph_out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Every page at three window sizes: overlapping controls are flagged as errors (the build goes on),
      # cut-off text as warnings; screenshots and a list of what moved since the previous build are kept
      - name: Layout check (screenshots, overlaps, changes since the previous build)
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SPECTROSCOPE_NO_GPU: "1"
        run: |
          $out = Join-Path $PWD "layout"
          $p = Start-Process -FilePath "build\Spectroscope_artefacts\Release\Ultimate Audio Viewer.exe" -ArgumentList "--layout-check", "`"$out`"" -WorkingDirectory $PWD -Wait -PassThru
          Write-Host "exit code $($p.ExitCode)"
          if (Test-Path layout\progress.log) { Get-Content layout\progress.log | Select-Object -Last 5 } else { Write-Host "no progress log" }
          if (-not (Test-Path layout\layout_report.txt)) { Write-Host "::error title=Layout check::the app wrote no report"; exit 1 }
          Get-Content layout\layout_report.txt
          $prev = gh run list --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq ".[0].databaseId"
          if ($prev) { gh run download $prev -n layout-check -D prev_layout 2>$null }
          "## Layout check" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content layout\layout_report.txt | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          python tools\layout_diff.py prev_layout\layout.json layout\layout.json | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Select-String -Path layout\layout_report.txt -Pattern " overlaps " | ForEach-Object { Write-Host "::error title=Layout overlap::$($_.Line)" }
          Select-String -Path layout\layout_report.txt -Pattern "text needs" | ForEach-Object { Write-Host "::warning title=Text cut off::$($_.Line)" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Keep the symbols (PDBs, to read crash reports from this build)
        uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: build/symbols/*.pdb
          retention-days: 90
          if-no-files-found: warn

      - name: Keep the layout check (screenshots of every page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-check
          path: layout/
          if-no-files-found: ignore

      - name: pluginval (Tracktion's plugin validator, strictness 5, no GUI)
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $pv = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $pv.FullName --strictness-level 5 --skip-gui-tests --validate "build\DigiCheckUniversal_artefacts\Release\VST3\Ultimate Audio Viewer.vst3"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::pluginval reported problems"; exit $LASTEXITCODE }

      - name: Target loader test
        run: build\target_loader_test_artefacts\Release\target_loader_test.exe

      - name: TargetBuilder smoke test (two genre folders of generated WAVs)
        shell: pwsh
        run: |
          python tools\make_test_songs.py tb_lib
          $tb = "build\TargetBuilder_artefacts\Release\Ultimate Audio Viewer Target Builder.exe"
          # TargetBuilder is a window app; --cli runs the command-line mode (Start-Process waits for it)
          $p = Start-Process -FilePath $tb -ArgumentList @("--cli", "tb_lib", "--out", "tb_out") -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "TargetBuilder --cli failed ($($p.ExitCode))"; exit 1 }
          foreach ($g in "GenreA", "GenreB") { if (-not (Test-Path "tb_out\$g.json")) { Write-Error "missing $g.json"; exit 1 } }
          $a = Get-Content tb_out\GenreA.json | ConvertFrom-Json; $b = Get-Content tb_out\GenreB.json | ConvertFrom-Json
          if ($a.normalized_mag_dB.Count -ne 2049) { Write-Error "wrong bin count"; exit 1 }
          if ($a.region_0_bounds[1] -le $b.region_0_bounds[1]) { Write-Error "bass-heavy genre should have more low end"; exit 1 }
          Write-Host "GenreA low band $($a.region_0_bounds), GenreB $($b.region_0_bounds)"

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\Spectroscope_artefacts\Release\Ultimate Audio Viewer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the Target Builder
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\TargetBuilder_artefacts\Release\Ultimate Audio Viewer Target Builder.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the VST3
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\DigiCheckUniversal_artefacts\Release\VST3\Ultimate Audio Viewer.vst3\Contents\x86_64-win\Ultimate Audio Viewer.vst3
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Zip the VST3 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\DigiCheckUniversal_artefacts\Release\VST3\Ultimate Audio Viewer.vst3" -DestinationPath dist\Ultimate-Audio-Viewer-VST3.zip -Force

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:APP_VERSION" installer\UltimateAudioViewer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Ultimate-Audio-Viewer-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # release files: the full name, hyphenated (GitHub turns spaces in asset names into dots); the files
      # inside (installed exe, VST3 bundle) keep the spaces
      - name: Name the release files
        shell: pwsh
        run: |
          Copy-Item "build\Spectroscope_artefacts\Release\Ultimate Audio Viewer.exe" dist\Ultimate-Audio-Viewer.exe
          Copy-Item "build\TargetBuilder_artefacts\Release\Ultimate Audio Viewer Target Builder.exe" dist\Ultimate-Audio-Viewer-Target-Builder.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Audio-Viewer-windows-x64
          path: |
            dist/Ultimate-Audio-Viewer-Setup.exe
            dist/Ultimate-Audio-Viewer-VST3.zip
            dist/Ultimate-Audio-Viewer.exe
            dist/Ultimate-Audio-Viewer-Target-Builder.exe

      # the files under the earlier names would otherwise stay on the release, out of date
      - name: Remove the earlier release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($n in "SpectroscopeSetup.exe", "Spectroscope.exe", "TargetBuilder.exe", "DigiCheckUniversal-VST3.zip") {
            gh release delete-asset latest $n -y 2>$null
          }
          exit 0

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ env.APP_VERSION }})
          prerelease: true
          make_latest: false
          body: |
            Version ${{ env.APP_VERSION }}, built from ${{ github.sha }}.
            **Ultimate Audio Viewer (UAV)**
            **Ultimate-Audio-Viewer-Setup.exe** installs the app, the Target Builder and the VST3 plugin (for all users by default, so the plugin goes to C:\Program Files\Common Files\VST3). It replaces an earlier Spectroscope / DigiCheck Universal install.
            **Ultimate-Audio-Viewer.exe** is the same app as a single portable file.
            **Ultimate-Audio-Viewer-Target-Builder.exe** makes tonal balance targets: drag songs into its window and save them as a target (also installed by the setup).
            **Ultimate-Audio-Viewer-VST3.zip** is the VST3 plugin (the setup can install it too): unzip "Ultimate Audio Viewer.vst3" into C:\Program Files\Common Files\VST3 (and delete an old "DigiCheck Universal.vst3" there).
            Signed: ${{ env.SIGN }}
          files: |
            dist/Ultimate-Audio-Viewer-Setup.exe
            dist/Ultimate-Audio-Viewer-VST3.zip
            dist/Ultimate-Audio-Viewer.exe
            dist/Ultimate-Audio-Viewer-Target-Builder.exe
